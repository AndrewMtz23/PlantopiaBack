{
  "openapi": "3.1.0",
  "info": {
    "title": "Plantopia API",
    "version": "2.0.0",
    "description": "PostgreSQL commerce API. Roles: 1 administrator, 2 customer, 3 employee, 4 courier. Ownership is always derived from the authenticated session. Money is serialized as exact decimal strings. Cash orders begin pending; only an administrator can confirm receipt of cash. Cancellation restores inventory once and only for eligible unpaid orders. Online payments are disabled."
  },
  "servers": [
    {
      "url": "/api/v1"
    }
  ],
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message",
              "requestId"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              },
              "requestId": {
                "type": "string"
              },
              "fields": {
                "type": "object"
              }
            }
          }
        }
      },
      "Page": {
        "type": "object",
        "required": [
          "items",
          "page",
          "pageSize",
          "total"
        ],
        "additionalProperties": false,
        "properties": {
          "items": {
            "type": "array",
            "maxItems": 100,
            "items": {
              "type": "object"
            }
          },
          "page": {
            "type": "integer",
            "minimum": 1
          },
          "pageSize": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100
          },
          "total": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "Money": {
        "type": "string",
        "pattern": "^\\d+\\.\\d{2}$"
      }
    }
  },
  "security": [
    {
      "bearerAuth": []
    }
  ],
