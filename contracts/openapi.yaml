{
  "openapi": "3.1.0",
  "info": {
    "title": "Plantopia API",
    "version": "2.0.0",
    "description": "PostgreSQL commerce API. Roles: 1 administrator, 2 customer, 3 employee, 4 courier. Ownership is always derived from the authenticated session. Money is serialized as exact decimal strings. Cash orders begin pending; only an administrator can confirm receipt of cash. Cancellation restores inventory once and only for eligible unpaid orders. Online payments are disabled."
