        "description": "Requires authenticated account. Resource owners are checked server-side; role fields cannot grant access. Legacy command alias uses the same policies as the unversioned route. The same key and payload return the original order; a changed payload returns 409. The server quoteHash is required. Initial payment state is pendiente. Receipt does not imply payment collected.",
