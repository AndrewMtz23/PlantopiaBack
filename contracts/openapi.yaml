                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "quoteHash",
                  "metodo",
                  "direccionEntrega"
                ],
                "additionalProperties": false,
                "properties": {
                  "quoteHash": {
                    "type": "string"
                  },
                  "metodo": {
                    "const": "efectivo"
                  },
                  "direccionEntrega": {
                    "type": "object",
                    "required": [
                      "nombre",
                      "telefono",
                      "domicilio",
                      "ciudad",
                      "estadoDireccion",
                      "codigoPostal"
                    ],
                    "properties": {
                      "nombre": {
                        "type": "string",
                        "maxLength": 100
                      },
                      "telefono": {
                        "type": "string",
                        "pattern": "^[0-9]{10}$"
                      },
                      "domicilio": {
                        "type": "string",
                        "maxLength": 450
                      },
                      "ciudad": {
                        "type": "string",
                        "maxLength": 120
                      },
                      "estadoDireccion": {
                        "type": "string",
                        "maxLength": 120
                      },
                      "codigoPostal": {
                        "type": "string",
                        "pattern": "^[0-9]{5}$"
                      },
                      "referenciasDomicilio": {
                        "type": "string",
                        "maxLength": 500
                      },
                      "latitud": {
                        "type": "number",
                        "minimum": -90,
                        "maximum": 90
                      },
                      "longitud": {
                        "type": "number",
                        "minimum": -180,
                        "maximum": 180
                      }
                    }
                  }
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 8,
              "maxLength": 120,
              "pattern": "^[A-Za-z0-9_-]+$"
            }
          }
        ]
