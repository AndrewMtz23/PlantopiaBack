name: backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: plantopia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: test -z "$(git ls-files 'Documentacion/**')"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/scanSecrets.js
      - run: npx prisma validate && npx prisma generate && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/plantopia_test
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/plantopia_test
      - run: node scripts/checkReadiness.js
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/plantopia_test
      - run: npm audit --audit-level=high
